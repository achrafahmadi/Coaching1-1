/* Layout: one headline, two equal path cards side by side (stacked on phones), brand colors from achrafahmadi.com */
:root{
  --ink:#141414; --panel:#1c1c1c; --line:#2b2b2b;
  --text:#f0f0f0; --muted:#b8b8b8; --gold:#C9A84C; --gold-hi:#e2c06a; --gold-ink:#141414;
  --wa:#25D366;
  --display:'Cairo','Segoe UI',Tahoma,sans-serif; --body:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font:400 17px/1.7 var(--body);padding-inline:0;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{font:900 20px var(--display);color:var(--gold);flex:1;min-width:0}
.lang{display:flex;gap:6px}
.lang button{font:600 14px var(--body);background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.hero{padding-block:44px 28px;max-width:720px}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.06em;margin-bottom:8px}
h1{font:900 clamp(34px,6vw,56px)/1.2 var(--display);margin:0 0 12px;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;margin-top:20px}
.card{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.card.main{border-color:var(--gold)}
.tag{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.05em}
.card h2{font:900 30px/1.25 var(--display);margin:0}
.card p{margin:0;color:var(--muted)}
.card ul{margin:4px 0 8px;padding-inline-start:20px;display:grid;gap:6px}
.price{font:700 18px var(--body);color:var(--text);margin-top:auto;padding-top:8px}
.price small{color:var(--muted);font-weight:400;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;text-align:center;text-decoration:none;font:700 17px var(--body);padding:13px 22px;border-radius:10px;background:var(--gold);color:var(--gold-ink)}
.btn:hover{background:var(--gold-hi)}
.btn.wa{background:var(--wa);color:#0b1f12}
.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
</style>
