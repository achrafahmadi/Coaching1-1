:root{--bg:#0b0b0c;--panel:#151516;--ink:#f3f1ec;--muted:#b4b1a8;--gold:#C9A84C;--gold2:#e6c76e;--line:rgba(255,255,255,.1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.7 C,Tahoma,sans-serif;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-weight:900;margin:0;line-height:1.18}
g{color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#111;font:800 17px C,sans-serif;padding:15px 30px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.wa{background:#25D366}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
/* hero */
.top{position:absolute;inset-inline:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;max-width:1100px;margin:0 auto}
.brand{font-weight:900;font-size:20px;text-decoration:none}
.hero{position:relative;min-height:88svh;display:flex;align-items:center;overflow:hidden;isolation:isolate}
.hero::before{content:'';position:absolute;inset:0;z-index:-2;background:radial-gradient(900px 600px at 80% 40%,rgba(201,168,76,.16),transparent 60%),#0b0b0c}
.hero img.ph{position:absolute;inset-block:0;inset-inline-start:0;height:100%;width:min(52%,620px);object-fit:cover;object-position:50% 12%;z-index:-1;-webkit-mask-image:linear-gradient(to left,transparent 0,#000 38%);mask-image:linear-gradient(to left,transparent 0,#000 38%);opacity:.92}
html[dir=rtl] .hero img.ph{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%);mask-image:linear-gradient(to right,transparent 0,#000 38%)}
.hero .box{margin-inline-start:auto;width:min(100%,560px);padding:100px 0 56px}
.eyebrow{color:var(--gold);font-weight:700;font-size:15px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:'';width:34px;height:2px;background:var(--gold)}
.hero h1{font-size:clamp(36px,6.2vw,70px)}
.hero p.sub{color:var(--muted);font-size:20px;margin:22px 0 30px;max-width:30em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.scroll{position:absolute;bottom:18px;inset-inline:0;text-align:center;color:var(--muted);font-size:13px;opacity:.7}
@media (max-width:760px){
  .hero{align-items:flex-end}
  .hero img.ph{width:100%;height:62%;inset-block-start:0;object-position:50% 8%;-webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent 100%)!important;mask-image:linear-gradient(to bottom,#000 45%,transparent 100%)!important}
  .hero .box{padding:0 0 64px;margin:0}
  .hero{min-height:92svh}
}
/* scenes */
.scenes{padding:56px 0 20px}
.scene{font-size:clamp(24px,4.4vw,42px);font-weight:900;line-height:1.35;padding:22px 0;border-bottom:1px solid var(--line);max-width:20em}
.scene small{display:block;font-size:15px;font-weight:700;color:var(--gold);margin-bottom:8px;letter-spacing:.04em}
.scene.dim{color:#8f8c85}
/* turn */
.turn{padding:56px 0;text-align:center;background:radial-gradient(700px 360px at 50% 50%,rgba(201,168,76,.12),transparent 70%)}
.turn h2{font-size:clamp(32px,6vw,64px);max-width:12em;margin:0 auto 22px}
.turn p{color:var(--muted);max-width:34em;margin:0 auto 14px;font-size:20px}
/* hope */
.hope{padding:56px 0}
.hope h2{font-size:clamp(28px,4.4vw,46px);margin-bottom:22px}
.hope ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.hope li{font-size:clamp(20px,3vw,28px);font-weight:700;padding:18px 24px;border-inline-start:4px solid var(--gold);background:linear-gradient(to left,rgba(201,168,76,.07),transparent)}
html[dir=rtl] .hope li{background:linear-gradient(to left,rgba(201,168,76,.08),transparent)}
.fine{color:var(--muted);font-size:14px;margin-top:20px}
/* proof */
.proof{padding:44px 0}
.proof h2{font-size:clamp(28px,4.6vw,46px);margin-bottom:10px}
.proof p.l{color:var(--muted);margin:0 0 26px}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;direction:ltr}
.pair{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair div{position:relative;border-radius:12px;overflow:hidden;background:var(--panel)}
.pair img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.pair span{position:absolute;bottom:8px;left:8px;background:var(--gold);color:#111;font-weight:800;font-size:12px;padding:2px 10px;border-radius:5px}
/* path */
.path{padding:44px 0}
.path h2{font-size:clamp(28px,4.6vw,46px);margin-bottom:30px}
.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;counter-increment:s}
.step::before{content:counter(s);display:block;font-weight:900;font-size:40px;line-height:1;color:var(--gold);margin-bottom:10px}
.step h3{font-size:22px;margin-bottom:6px}
.step p{color:var(--muted);margin:0;font-size:16px}
/* coach */
.coach{padding:60px 0;display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:34px;align-items:center}
.coach img{width:100%;border-radius:18px;aspect-ratio:3/4;object-fit:cover;object-position:50% 10%;border:1px solid var(--line)}
.coach h2{font-size:clamp(26px,4vw,40px);margin-bottom:12px}
.coach p{color:var(--muted);margin:0 0 10px}
@media (max-width:640px){.coach{grid-template-columns:1fr}.coach img{max-width:240px}}
/* plans */
.plans{padding:44px 0}
.plans h2{font-size:clamp(28px,4.6vw,46px);margin-bottom:26px;text-align:center}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;text-align:center}
.card.best{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.1),var(--panel))}
.card .m{font-weight:900;font-size:52px;color:var(--gold);line-height:1}
.card .m small{font-size:20px;color:var(--muted);margin-inline-start:8px}
.card h3{font-size:19px;color:var(--muted);margin:4px 0}
.card .p{font-weight:900;font-size:46px;margin:8px 0 14px}
.card .p small{font-size:18px;color:var(--muted)}
.card ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;text-align:start;font-size:15.5px}
.card li{display:flex;gap:10px}
.card li::before{content:'✓';color:var(--gold);font-weight:900}
.card .btn{margin-top:auto;width:100%;text-align:center}
.pay{text-align:center;color:var(--muted);font-size:14px;margin-top:16px}
/* close */
.close{padding:64px 0 56px;text-align:center;background:radial-gradient(800px 420px at 50% 40%,rgba(201,168,76,.14),transparent 70%)}
.close h2{font-size:clamp(32px,6vw,62px);max-width:13em;margin:0 auto 20px}
.close p{color:var(--muted);font-size:20px;max-width:30em;margin:0 auto 30px}
form{display:grid;gap:12px;max-width:460px;margin:34px auto 0;text-align:start}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
input,select{font:400 16px C,sans-serif;padding:13px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13.5px;text-align:center}
.sticky{display:none}
@media (max-width:640px){
  .sticky{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;position:fixed;inset-inline:0;bottom:0;z-index:60;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,11,12,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .sticky .btn{text-align:center;padding:13px 8px;font-size:15px}
  body{padding-bottom:76px}
  .sticky{transform:translateY(110%);transition:transform .3s}
  .sticky.show{transform:none}
}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

.nav{position:fixed;inset-inline:0;top:0;z-index:80;transition:background .3s,backdrop-filter .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(11,11,12,.9);backdrop-filter:blur(10px);border-color:var(--line)}
.navin{max-width:1100px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
.brand{font-weight:900;font-size:20px;text-decoration:none;margin-inline-end:auto}
.nav nav{display:flex;align-items:center;gap:22px}
.nav nav a{text-decoration:none;font-weight:700;font-size:15px;color:var(--muted)}
.nav nav a:hover{color:var(--gold)}
.nav nav a.navbtn{background:var(--gold);color:#111;padding:8px 18px;border-radius:10px;font-weight:800}
.nav nav a.navbtn:hover{color:#111;filter:brightness(1.08)}
.burger{display:none;background:none;border:0;padding:8px;cursor:pointer}
.burger i{display:block;width:24px;height:2px;background:var(--ink);margin:5px 0;transition:transform .25s,opacity .25s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
section[id]{scroll-margin-top:70px}
@media (max-width:760px){
  .burger{display:block}
  .nav nav{position:absolute;inset-inline:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:rgba(11,11,12,.97);border-bottom:1px solid var(--line);max-height:0;overflow:hidden;transition:max-height .3s}
  .nav.open nav{max-height:320px}
  .nav nav a{padding:16px 22px;border-top:1px solid var(--line);font-size:17px;color:var(--ink)}
  .nav nav a.navbtn{margin:12px 22px;text-align:center;border-radius:10px}
  .nav.open{background:rgba(11,11,12,.97)}
}

.lang{display:flex;gap:4px}
.lang button{font:700 12px C,sans-serif;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#111;border-color:var(--gold)}
html[dir=ltr] .hero h1{line-height:1.08}
html[dir=ltr] .scene{max-width:22em}
html[dir=ltr] body{font-size:17.5px}
html[dir=ltr] .pair span{left:8px;right:auto}
@media (max-width:760px){.navin{gap:10px}.brand{font-size:17px}.lang button{padding:4px 7px}}
@media (max-width:480px){.brand{font-size:14px;white-space:nowrap}.lang button{padding:3px 6px;font-size:11px}.navin{padding:12px 14px;gap:8px}}

.hp{display:inline-block;margin-top:16px;color:var(--gold);font-weight:700;font-size:15px;text-decoration:none;border-bottom:1px dashed rgba(201,168,76,.5)}

.ph b{display:block;font-weight:900;font-size:21px}
.ph span{color:var(--muted);font-size:16px}
.faq{padding:44px 0}
details{border-bottom:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;font-weight:800;font-size:18px}

.whys{padding:40px 0;text-align:center}

.whys p.l{color:var(--muted);margin:0 auto;font-size:16px}
.chips{list-style:none;padding:0;margin:18px auto 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px}
.chips li{background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.wnote{color:var(--muted);font-size:13.5px;margin:14px auto 0;max-width:56ch}
.proof{padding:36px 0}

.plans{padding:36px 0}

.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}

.story .tag{font-size:12px;color:var(--muted)}

.car{position:relative}
.stories{display:flex!important;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;direction:ltr;padding:2px 2px 8px}

.story{flex:0 0 min(84%,340px);scroll-snap-align:center;direction:rtl}
html[dir=ltr] .story{direction:ltr}
.cbtn{position:absolute;top:34%;z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(11,11,12,.85);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.cbtn:hover{border-color:var(--gold);color:var(--gold)}
.cbtn.prev{left:-6px}.cbtn.next{right:-6px}

.cdots{display:flex;justify-content:center;gap:8px;margin-top:12px;direction:ltr}
.cdots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;transition:background .2s,width .2s}
.cdots i.on{background:var(--gold);width:22px;border-radius:6px}

.sgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:stretch;direction:ltr}
.swrap{position:relative;display:flex;flex-direction:column;min-width:0}
#sfig{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;border-radius:12px}
#sfig::-webkit-scrollbar{display:none}
#sfig .pair{flex:0 0 100%;scroll-snap-align:center;margin:0;direction:ltr}
#sfig .pair div{border-radius:10px}
.swrap .cbtn{top:calc(50% - 40px);width:36px;height:36px;font-size:22px;background:rgba(11,11,12,.85);border:1px solid var(--gold);color:var(--gold)}
.swrap .cbtn.prev{left:8px}.swrap .cbtn.next{right:8px}
.scard{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:16px;direction:rtl}

.spt{border-inline-start:3px solid var(--gold);padding-inline-start:16px;display:grid;gap:8px}
.spt b{font-size:20px;font-weight:900}
.spt span{color:var(--muted);font-size:16px;line-height:1.7}
.spt span.empty{border:1px dashed rgba(201,168,76,.45);border-radius:10px;padding:10px 12px;font-size:14px}
.scard small{color:var(--muted);font-size:12.5px}
@media (max-width:820px){.sgrid{grid-template-columns:1fr}.swrap .cbtn{display:none}}

.", "st3h": "Redevenir l'homme que tu es", "st3p": "Tu recommences à te sentir l'homme que tu dois être, comme beaucoup d'hommes qui ont commencé la TRT avant toi. Achraf te suit personnellement sur WhatsApp. Les résultats varient.", "pl_h": "Choisis <g>ton départ</g>", "u1": "mois", "u3": "mois", "c1h": "Un bon départ", "c2h": "Transformation", "c3h": "Transformation complète", "dh": "MAD", "b1": "Plan alimentaire personnalisé et mis à jour", "b2": "Vidéos sur les protocoles TRT + bonus (compléments)", "b3": "Achraf te suit personnellement sur WhatsApp", "btn1": "Je veux le plan 1 mois", "btn2": "Je veux le plan 3 mois", "btn3": "Je veux le plan 6 mois", "pay": "Paiement : virement bancaire, CIH, carte ou CashPlus.", "cl_h": "Les mois à venir passeront <g>de toute façon</g>.", "cl_p": "La question est de savoir si tu les passes avec le même corps et la même fatigue, ou avec une nouvelle décision. Commence par un message.", "f_name": "Ton nom", "f_tel": "Ton numéro WhatsApp", "f_tel_ph": "+212 6 12 34 56 78", "f_plan": "Offre", "f_goal": "Ton objectif principal", "f_ph": "Exemple : retrouver l'énergie et prendre du muscle", "m_h": "Commence maintenant", "m_p": "Remplis ces informations et on continue sur WhatsApp, où Achraf confirme ton offre et le paiement.", "n7": "Options", "pt_h": "Choisis <g>ton chemin</g>", "c_tag": "Le plus adapté", "c_h": "Coaching 1-1 avec Achraf", "c_p": "Un plan conçu pour toi et un suivi direct avec moi, pour atteindre ton objectif.", "c1": "Plan alimentaire personnalisé et optimisé", "c2": "Vidéos protocoles TRT + bonus (compléments)", "c3": "Achraf te suit personnellement sur WhatsApp", "c_price": "À partir de 1500 MAD", "v_tag": "Commence seul", "v_h": "Programme de vidéos de cours", "v_p": "Une communauté Skool avec des vidéos pédagogiques sur le TRT, pour apprendre à ton rythme.", "v1": "Vidéos de cours pédagogiques sur le TRT", "v2": "Une communauté de personnes qui apprennent comme toi", "v_price": "19 $ par mois", "v_trial": "· essai gratuit disponible", "v_btn": "Rejoindre sur Skool", "f_btn": "Envoyer ma demande", "o1": "1 mois - 1500 MAD", "o2": "3 mois - 3500 MAD", "o3": "6 mois - 8000 MAD", "foot": "Ce programme est destiné à la forme générale et à l'information, et ne constitue pas un avis médical. Tout TRT est une décision médicale à prendre avec ton médecin.", "st_start": "Commencer", "st_wa": "WhatsApp", "wa_msg": "Salut Achraf, j'ai vu la page et je veux comprendre ce qui m'arrive et commencer.", "f_msg": "Salut Achraf, je m'appelle {n}. Je veux le plan {p}. Mon objectif : {g}", "ph_h": "Ce qui se passe, jour après jour", "ph_lead": "Chaque semaine, on mesure : poids, tour de taille et photos. Si un chiffre ne bouge pas, on change le plan.", "ph1_h": "Mois 2 : Tu commences à le sentir", "ph1_p": "Tu remarques les bénéfices : énergie, humeur et envie se remettent en mouvement.", "ph2_h": "Mois 3 : Tu vois les résultats", "ph2_p": "Les résultats se voient sur ton corps, ta force et dans le miroir. On ajuste ton plan selon tes chiffres.", "ph3_h": "Mois 6 : Une autre personne", "ph3_p": "Tu deviens une autre personne, vers la vie que tu voulais. Les résultats varient d'une personne à l'autre.", "fq_h": "Questions", "q1": "Qu'est-ce qui est inclus ?", "q2": "Quelle offre choisir ?", "q3": "C'est naturel ou TRT ?", "q4": "Quels résultats puis-je attendre ?", "q5": "Comment commencer ?", "q6": "Comment payer ?", "a1": "Un plan alimentaire personnalisé et optimisé, des vidéos sur les protocoles TRT avec un bonus sur les compléments, et Achraf te suit personnellement sur WhatsApp.", "a2": "Choisis 1 mois pour bien démarrer et voir comment tu réagis. Choisis 3 mois pour une transformation visible. Choisis 6 mois pour aller jusqu'au bout.", "a3": "Le programme repose sur l'alimentation, le suivi et le mode de vie, et inclut des vidéos pédagogiques sur les protocoles TRT. Nous ne prescrivons ni ne vendons d'hormones. Tout TRT est une décision médicale, à prendre et à suivre avec ton médecin.", "a4": "Les résultats dépendent de ton point de départ et de ta rigueur. Personne ne peut promettre un résultat précis, mais tu suivras tes chiffres chaque semaine pour voir clairement ta progression.", "a5": "Remplis le court formulaire ci-dessous. Achraf te répondra sur WhatsApp pour confirmer ton offre et le paiement.", "a6": "Virement bancaire, CIH, carte ou CashPlus. Les détails de paiement te sont envoyés sur WhatsApp après ta demande.", "ph0_h": "Mois 1 : Ton corps s'adapte", "ph0_p": "Ton corps commence à s'adapter. On démarre avec les mesures, les photos et ton plan alimentaire, et on suit tout avec toi.", "hp": "Offres à partir de 1500 MAD", "n6": "FAQ", "n_tl": "Étapes", "wy_h": "Alimentation et entraînement en place, mais le corps ne change pas ?", "wy_l": "Dans certains cas, la cause est hormonale. Des signes que beaucoup remarquent :", "wy1": "Fatigue constante malgré le sommeil", "wy2": "Baisse de libido", "wy3": "Récupération lente après l'entraînement", "wy4": "Le muscle ne vient pas", "wy5": "Humeur instable", "wy_n": "Ces signes ne sont pas un diagnostic. Seul un bilan sanguin interprété par un médecin identifie la cause. Contenu éducatif uniquement.", "cl_n": "Client", "st_ph": "✎ Histoire du client ici : d'où il est parti, ce qui a changé, avec ses mots. (texte réel du client uniquement)", "st_tag": "Visage flouté. Les résultats varient et ne sont pas garantis.", "sc_h": "Histoire du client", "bn_h": "Ce qui change au-delà du miroir", "bn1_h": "Plus d'énergie le matin", "bn1_p": "Beaucoup remarquent une différence d'énergie et d'élan dès les premières semaines.", "bn2_h": "Meilleur moral", "bn2_p": "Une vision plus lumineuse, plus d'espoir et de pensées positives. Un changement subtil, mais on le sent.", "bn3_h": "Calme et confiance", "bn3_p": "Tu te sens plus calme et détendu quand tu parles, et plus stable en toi.", "bn_note": "Les résultats varient d'une personne à l'autre et ne sont pas garantis.", "bn4_h": "Le TRT n'est pas le monstre qu'on décrit", "bn4_p": "Une grande partie de la peur autour du TRT est exagérée. Bien fait, avec bilans sanguins, médecin et suivi, c'est un outil sérieux pour les personnes ayant un vrai déficit.", "bn5_h": "Le risque, c'est de le faire à l'aveugle", "bn5_p": "Tes chiffres ne sont pas ceux d'un autre. D'où l'importance des analyses et du suivi, et nous t'expliquons les protocoles pour que tu en parles avec ton médecin en connaissance de cause."}};

var STORIES=[
 {name:{ar:'',en:'',fr:''},plan:{ar:'',en:'',fr:''},text:{ar:'',en:'',fr:''}},
 {name:{ar:'',en:'',fr:''},plan:{ar:'',en:'',fr:''},text:{ar:'',en:'',fr:''}},
 {name:{ar:'',en:'',fr:''},plan:{ar:'',en:'',fr:''},text:{ar:'',en:'',fr:''}},
 {name:{ar:'',en:'',fr:''},plan:{ar:'',en:'',fr:''},text:{ar:'',en:'',fr:''}},
 {name:{ar:'',en:'',fr:''},plan:{ar:'',en:'',fr:''},text:{ar:'',en:'',fr:''}}
];

function renderStories(){var D=T[lang],h='';
 PAIRS.forEach(function(P,i){h+='<figure class="pair"><div><img src="'+P[0]+'" alt="'+D.before+'" loading="lazy"><span>'+D.before+'</span></div><div><img src="'+P[1]+'" alt="'+D.after+'" loading="lazy"><span>'+D.after+'</span></div></figure>'});
 var c=document.getElementById('sfig'),pos=c.scrollLeft;c.innerHTML=h;c.scrollLeft=pos;bindStories();}
function curStory(){var c=document.getElementById('sfig'),f=c.children;if(!f.length)return 0;return Math.max(0,Math.min(f.length-1,Math.round(c.scrollLeft/f[0].offsetWidth)))}
function showStory(){var D=T[lang],i=curStory(),st=STORIES[i]||{name:{},plan:{},text:{}},d=document.getElementById('sdots'),n=(i%5)+1;
 for(var j=0;j<d.children.length;j++)d.children[j].classList.toggle('on',j===i);
 var tx=st.text[lang],nm=st.name[lang];
 document.getElementById('sh').textContent=tx?D.sc_h:D.bn_h;
 document.getElementById('sname').textContent=tx?(nm||(D.cl_n+' '+(i+1)))+(st.plan[lang]?' · '+st.plan[lang]:''):D['bn'+n+'_h'];
 var t=document.getElementById('stext');t.textContent=tx||D['bn'+n+'_p'];t.className='';
 document.getElementById('stag').textContent=D.bn_note;}
function bindStories(){var c=document.getElementById('sfig'),d=document.getElementById('sdots');d.innerHTML='';
 for(var i=0;i<c.children.length;i++)d.appendChild(document.createElement('i'));
 function w(){return c.children[0].offsetWidth}
 c.onscroll=showStory;
 document.getElementById('sprev').onclick=function(){c.scrollBy({left:-w()})};
 document.getElementById('snext').onclick=function(){c.scrollBy({left:w()})};
 c.onkeydown=function(e){if(e.key==='ArrowRight')c.scrollBy({left:w()});if(e.key==='ArrowLeft')c.scrollBy({left:-w()})};
 showStory();}
var NUM="212764747363",lang="ar";
function waMsg(){return T[lang].wa_msg}
function apply(l){lang=l;var D=T[l];
 document.documentElement.lang=D.code;document.documentElement.dir=(l==='ar')?'rtl':'ltr';document.title=D.title;
 document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=D[e.getAttribute('data-i')]});
 document.querySelectorAll('[data-ih]').forEach(function(e){e.innerHTML=D[e.getAttribute('data-ih')]});
 document.querySelectorAll('[data-ip]').forEach(function(e){e.placeholder=D[e.getAttribute('data-ip')]});
 document.querySelectorAll('[data-wa]').forEach(function(a){a.href='https://wa.me/'+NUM+'?text='+encodeURIComponent(waMsg())});
 document.querySelectorAll('.hero img.ph').forEach(function(i){i.alt=D.brand});
 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.l===l))});
 renderStories();try{localStorage.setItem('lang',l)}catch(e){}}
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.l)})});
document.querySelectorAll('[data-pick]').forEach(function(a){a.addEventListener('click',function(){document.getElementById('c').value=a.dataset.pick})});
var md=document.getElementById('modal');
function om(pk){if(pk)document.getElementById('c').value=pk;var _c=document.getElementById('c').value;track('InitiateCheckout','begin_checkout',{plan:_c,value:PLAN_VALUE[_c],currency:'MAD',lang:lang});md.hidden=false;document.body.style.overflow='hidden';setTimeout(function(){document.getElementById('n').focus()},50)}
var cmHook=null;function cm(){md.hidden=true;document.body.style.overflow='';if(cmHook&&md.dataset.sent!=='1')cmHook();md.dataset.sent=''}
document.querySelectorAll('[data-open]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var o=document.getElementById('nav');if(o)o.classList.remove('open');om(a.dataset.pick)})});
document.getElementById('mx').addEventListener('click',cm);md.addEventListener('click',function(e){if(e.target===md)cm()});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!md.hidden)cm()});
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();
 var D=T[lang],c=document.getElementById('c').value;
 var t=D.f_msg.replace('{n}',document.getElementById('n').value).replace('{p}',D['o'+c]).replace('{g}',document.getElementById('g').value);
 track('Lead','generate_lead',{plan:c,value:PLAN_VALUE[c],currency:'MAD',lang:lang});saveLead('sent_to_whatsapp');md.dataset.sent='1';
 window.open('https://wa.me/'+NUM+'?text='+encodeURIComponent(t),'_blank','noopener');cm()});

document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});

apply(T[saved]?saved:'ar');
/* ===== SAVE LEADS TO GOOGLE SHEET (before WhatsApp) ===== */
var UTM=(function(){var q=new URLSearchParams(location.search),o={};
 ['utm_source','utm_medium','utm_campaign'].forEach(function(k){o[k]=q.get(k)||''});
 var st=q.get('s');if(st&&!o.utm_source){o.utm_source='instagram';o.utm_medium='story';o.utm_campaign=st}
 try{if(o.utm_source||o.utm_campaign)sessionStorage.setItem('utm',JSON.stringify(o));else o=JSON.parse(sessionStorage.getItem('utm'))||o}catch(e){}
 return o})();
var LEAD_ID=Date.now().toString(36)+Math.random().toString(36).slice(2,6),lastSent='';
function saveLead(status){if(!LEADS_URL)return;
 var c=document.getElementById('c').value,n=document.getElementById('n').value.trim(),g=document.getElementById('g').value.trim(),tel=document.getElementById('tel').value.trim();
 if(!n&&!g&&!tel)return;
 var d={id:LEAD_ID,status:status,name:n,phone:tel,plan:T[lang]['o'+c]||c,value:PLAN_VALUE[c],goal:g,lang:lang,
  utm_source:UTM.utm_source,utm_medium:UTM.utm_medium,utm_campaign:UTM.utm_campaign,referrer:document.referrer,page:location.pathname};
 var body=JSON.stringify(d);if(body===lastSent)return;lastSent=body;
 /* keepalive fetch: survives opening WhatsApp; sendBeacon is silently dropped by Apps Script */
 try{fetch(LEADS_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})}catch(e){}}
['n','tel','g','c'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){saveLead('started')})});
cmHook=function(){saveLead('started')};
