<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diet Generator — Achraf Ahmadi Coaching</title>
<meta name="description" content="Free personalised diet plan by Achraf Ahmadi Coaching — your macros, meals and grams to weigh.">
<meta name="theme-color" content="#0D1B2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A; --gold:#C9A84C; --gold-l:#F6EBCB; --bg:#F7F7FB; --card:#fff; --muted:#7A8396; --line:#ECEDF3;
  --pro:#6366F1; --pro-l:#EEF0FF; --carb:#F59E0B; --carb-l:#FFF5E1; --fat:#10B981; --fat-l:#E3F8F0;
  --ok:#22C55E; --red:#EF4444; --r:22px;
  --shadow:0 6px 24px rgba(13,27,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:'Plus Jakarta Sans','Cairo',system-ui,sans-serif}
html[dir=rtl] body{font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif}
html[dir=rtl] .brand{letter-spacing:0}
html[dir=rtl] .foot{letter-spacing:0}
.lang{background:#fff;border-radius:999px;padding:7px 11px;font-weight:800;font-size:12px;box-shadow:var(--shadow)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.brand{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.hello{font-size:22px;font-weight:800;margin-top:2px}
.chips{display:flex;gap:8px}
.chip{background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;box-shadow:var(--shadow);display:flex;gap:5px;align-items:center}

/* ---------- level bar ---------- */
.level{margin:12px 20px 4px;background:linear-gradient(135deg,#0D1B2A,#1F3550);color:#fff;border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.lvl-badge{width:52px;height:52px;border-radius:16px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:26px;flex:none}
.lvl-info{flex:1}
.lvl-name{font-weight:800;font-size:15px}
.lvl-sub{font-size:12px;color:#B8C2D0;margin-top:2px}
.xpbar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- day switch ---------- */
.seg{display:flex;background:#fff;margin:14px 20px;border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:11px 4px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted);transition:.2s}
.seg button.on{background:var(--navy);color:#fff}

/* ---------- ring card ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:0 20px 14px;padding:18px}
.ringwrap{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-size:26px;font-weight:800;line-height:1}
.ring .small{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.bars{flex:1;display:flex;flex-direction:column;gap:12px}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.bar .lab span:last-child{color:var(--muted);font-weight:600}
.bar .track{height:9px;border-radius:99px;margin-top:5px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- quest ---------- */
.quest{display:flex;align-items:center;gap:12px;background:var(--gold-l);border-radius:18px;margin:0 20px 16px;padding:13px 16px;font-size:13px;font-weight:700}
.quest .q-emoji{font-size:22px}
.quest .q-x{margin-inline-start:auto;font-size:12px;color:#8A6D1F;font-weight:800;white-space:nowrap}

.h2{font-size:17px;font-weight:800;margin:20px 20px 10px;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font-size:12px;color:var(--muted);font-weight:600}

/* ---------- meal card ---------- */
.meal{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin:0 20px 14px;overflow:hidden;transition:.3s;border:2px solid transparent}
.meal.done{border-color:var(--ok);background:#FBFFFC}
.meal-head{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.meal-ico{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.meal.workout .meal-ico{background:#FFECEC}
.meal-t{font-weight:800;font-size:15px}
.meal-s{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.meal-k{margin-inline-start:auto;text-align:end;font-weight:800;font-size:15px}
.meal-k small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.items{padding:0 12px 6px}
.item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;width:100%;text-align:start;transition:.15s}
.item:active{background:var(--bg)}
.item .e{font-size:24px;width:34px;text-align:center}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm span{font-size:11px;font-weight:700}
.item .g{font-size:20px;font-weight:800;white-space:nowrap}
.item .g small{font-size:12px;color:var(--muted);font-weight:700;margin-inline-start:2px}
.item .sw{font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px}
.t-P{background:var(--pro-l);color:var(--pro)} .t-C{background:var(--carb-l);color:#B76E00} .t-F{background:var(--fat-l);color:#0A8A5F}
.extra{margin:2px 20px 4px;margin-inline-start:62px;font-size:12px;color:var(--muted);font-weight:600}
.meal-foot{padding:6px 16px 16px}
.done-btn{width:100%;padding:14px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;display:flex;gap:8px;justify-content:center;align-items:center;transition:transform .1s}
.done-btn:active{transform:scale(.97)}
.meal.done .done-btn{background:var(--ok)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;background:#fff;border-radius:24px;display:flex;padding:8px;box-shadow:0 10px 40px rgba(13,27,42,.16);z-index:20}
.nav button{flex:1;padding:8px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button .ni{font-size:21px;filter:grayscale(1);opacity:.6;transition:.2s}
.nav button.on{color:var(--navy);background:var(--bg)}
.nav button.on .ni{filter:none;opacity:1}

/* ---------- sheets / overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(13,27,42,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;max-height:82vh;overflow:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p.sub{margin:0 0 14px;color:var(--muted);font-size:13px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:16px;text-align:start;border:2px solid var(--line);margin-bottom:8px}
.opt.on{border-color:var(--navy);background:var(--bg)}
.opt .e{font-size:26px}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--muted);font-weight:600}
.opt .g{margin-inline-start:auto;font-weight:800;font-size:16px;white-space:nowrap}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;animation:pop .35s;box-shadow:0 10px 30px rgba(0,0,0,.2);white-space:nowrap}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:55}

/* ---------- wizard ---------- */
.wiz{min-height:100vh;display:flex;flex-direction:column;padding:20px 22px calc(26px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.wiz-top{display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:18px;font-weight:800}
.prog{flex:1;height:8px;background:#E7E8EF;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.step{font-size:12px;font-weight:800;color:var(--muted)}
.wiz h1{font-size:28px;line-height:1.15;margin:30px 0 6px;font-weight:800;animation:pop .4s}
.wiz .lead{color:var(--muted);font-weight:600;margin:0 0 22px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{background:#fff;border:2px solid transparent;border-radius:20px;padding:18px 14px;text-align:start;box-shadow:var(--shadow);transition:.15s}
.pick:active{transform:scale(.97)}
.pick.on{border-color:var(--navy);background:#fff}
.pick .e{font-size:32px}
.pick b{display:block;font-size:15px;margin-top:8px}
.pick span{font-size:12px;color:var(--muted);font-weight:600}
.list .pick{display:flex;gap:14px;align-items:center;width:100%;margin-bottom:10px}
.list .pick .e{font-size:28px}
.list .pick b{margin:0}
.num{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.num .lab{font-size:13px;font-weight:700;color:var(--muted)}
.num .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.num .val{font-size:40px;font-weight:800}
.num .val small{font-size:16px;color:var(--muted);margin-inline-start:4px}
.step-btn{width:46px;height:46px;border-radius:16px;background:var(--bg);font-size:24px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--navy)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:18px;border:2px solid transparent}
.pills button.on{background:var(--navy);color:#fff}
.cta{margin-top:auto;padding-top:22px}
.cta button{width:100%;padding:18px;border-radius:20px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 24px rgba(13,27,42,.25)}
.cta button:disabled{opacity:.35;box-shadow:none}

.reveal{text-align:center}
.reveal .kcal{font-size:64px;font-weight:800;letter-spacing:-.02em;margin:14px 0 0;animation:pop .6s}
.reveal .kl{color:var(--muted);font-weight:700}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.mac3 div{border-radius:20px;padding:16px 8px;animation:pop .6s backwards}
.mac3 div:nth-child(2){animation-delay:.1s}.mac3 div:nth-child(3){animation-delay:.2s}
.mac3 b{display:block;font-size:26px}
.mac3 span{font-size:12px;font-weight:700}
.note{background:#fff;border-radius:18px;padding:14px 16px;font-size:13px;font-weight:600;text-align:start;box-shadow:var(--shadow)}
.spinner{width:70px;height:70px;border-radius:50%;border:7px solid #E7E8EF;border-top-color:var(--gold);animation:spin 1s linear infinite;margin:80px auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- plan / shop / me ---------- */
.row-l{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.row-l:last-child{border:0}
.row-l b{font-weight:800}
.mini{display:flex;gap:6px}
.mini span{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.shop-item:last-child{border:0}
.shop-item .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;flex:none}
.shop-item.got .bx{background:var(--ok);border-color:var(--ok)}
.shop-item.got .nm{text-decoration:line-through;color:var(--muted)}
.shop-item .e{font-size:22px}
.shop-item .nm{flex:1;font-weight:700;font-size:14px}
.shop-item .q{font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.badge .e{font-size:30px}
.badge b{display:block;font-size:12px;margin-top:6px}
.badge span{font-size:10px;color:var(--muted);font-weight:600}
.badge.locked{opacity:.35;filter:grayscale(1)}
details{background:#fff;border-radius:18px;margin:0 20px 10px;box-shadow:var(--shadow);overflow:hidden}
summary{padding:16px 18px;font-weight:800;font-size:15px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:'＋';color:var(--muted)}
details[open] summary::after{content:'－'}
details .in{padding:0 18px 16px;font-size:13.5px;line-height:1.55;font-weight:500}
details .in b{font-weight:800}
.btn2{display:block;width:calc(100% - 40px);margin:6px 20px 10px;padding:15px;border-radius:18px;background:#fff;font-weight:800;box-shadow:var(--shadow);font-size:14px}
.btn2.gold{background:var(--gold);color:var(--navy)}
.foot{text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin:22px 0 0;letter-spacing:.06em}
a{color:inherit}
.fld{width:100%;border:0;background:var(--bg);border-radius:14px;padding:14px;font:inherit;font-size:17px;font-weight:700;color:var(--navy);margin-top:8px;outline:none}
.fld:focus{box-shadow:0 0 0 2px var(--navy)}
.nav button{font-size:10px}
</style>
<script src="/track.js" defer></script>
</head>

<script>

   LANGUAGE
========================================================= */

const AR=()=>LANG==='ar';
const tx=(en,ar)=>AR()?ar:en;
function setLang(l){LANG=l;try{localStorage.setItem('aac-lang',l)}catch(e){}applyDir();render()}
function applyDir(){document.documentElement.lang=AR()?'ar':'en';document.documentElement.dir=AR()?'rtl':'ltr'}
const G=()=>tx('g','غ'), KC=()=>tx('kcal','كالوري');
const langBtn=()=>`<button class="lang" onclick="setLang('${AR()?'en':'ar'}')">${AR()?'EN':'الدارجة'}</button>`;

/* =========================================================
   DATA
========================================================= */
const FOODS = {

    {n:'Orange juice',a:'عصير الليمون',e:'🧃',v:10.4,how:['ml','مل']},
    {n:'Honey',a:'العسل',e:'🍯',v:82.4,how:['as is','كيف هو']},
    {n:'Rice cakes',a:'گاليت دو ريز',e:'🍘',v:81,how:['as is','كيف هو']},

const fn=f=>AR()?f.a:f.n, fh=f=>f.how[AR()?1:0];
const CAT = {P:{en:'Protein',ar:'بروتين',cls:'t-P',col:'var(--pro)',bg:'var(--pro-l)'},
             C:{en:'Carbs',ar:'كارب',cls:'t-C',col:'var(--carb)',bg:'var(--carb-l)'},
             F:{en:'Fat',ar:'دهون',cls:'t-F',col:'var(--fat)',bg:'var(--fat-l)'}};
const cl=k=>AR()?CAT[k].ar:CAT[k].en;

// Achraf Ahmadi Coaching formula
const SET = {pro:2.2, fat:0.7, bulkCarbs:{Low:500,Moderate:450,High:400}, cutDef:500, restCarb:.15, hiCarb:.30, hiFat:.30};
const ACT = {Sedentary:1.2, Light:1.375, Moderate:1.55, 'Very active':1.725, Athlete:1.9};

const TMEALS = [
  {n:['Meal 1','الوجبة 1'],i:'🌅',s:[.17,.15,.25],d:['Egg whites','Oats','Almonds']},
  {n:['Meal 2','الوجبة 2'],i:'🍽️',s:[.17,.15,.25],d:['Chicken breast','Basmati rice','Olive oil']},

/* =========================================================

========================================================= */
const r5=x=>Math.round(x/5)*5;
const food=(k,n)=>FOODS[k].find(f=>f.n===n);
function targets(p){
  const bmr=Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==='Male'?5:-161));
  const tdee=Math.round(bmr*ACT[p.activity]);
  const pro=Math.round(SET.pro*p.weight), fat=Math.round(SET.fat*p.weight);
  let carb;
  if(p.goal==='Bulk') carb=SET.bulkCarbs[p.bf];
  else carb=Math.max(0,Math.round((tdee-(p.goal==='Cut'?SET.cutDef:0)-pro*4-fat*9)/4));
  carb=Math.max(0,carb+(p.carbAdj||0));
  const mk=(P,C,F)=>({P,C,F,kcal:P*4+C*4+F*9});
  return {bmr,tdee,T:mk(pro,carb,fat),H:mk(pro,Math.round(carb*(1+SET.hiCarb)),Math.round(fat*(1-SET.hiFat))),R:mk(pro,Math.round(carb*(1-SET.restCarb)),fat)};
}
function mealPlan(dayKey){
  const t=targets(S.profile)[dayKey];
  return DAYS[dayKey].meals.map((m,i)=>{
    const g={P:r5(t.P*m.s[0]),C:r5(t.C*m.s[1]),F:Math.round(t.F*m.s[2])};
    const items=['P','C','F'].map((k,j)=>{
      if(!g[k]) return null;
      const name=(S.choices[dayKey]&&S.choices[dayKey][i]&&S.choices[dayKey][i][k])||m.d[j];
      const f=food(k,name)||FOODS[k][0];
      return {k,f,macro:g[k],grams:r5(g[k]/f.v*100)};
    }).filter(Boolean);
    return {...m,idx:i,g,kcal:g.P*4+g.C*4+g.F*9,items};
  });
}
function dayLog(d){d=d||today();if(!S.log[d])S.log[d]={type:S.profile&&S.profile.days>0?'T':'R',done:[]};return S.log[d]}
function dayComplete(d){const L=S.log[d];return L&&L.done.length>=DAYS[L.type].meals.length}
function streak(){let d=today(),n=0;if(!dayComplete(d))d=shiftDay(d,-1);while(dayComplete(d)){n++;d=shiftDay(d,-1)}return n}
const level=()=>{const l=Math.floor(S.xp/LV_XP);return {i:l,name:L2(LEVELS[Math.min(l,LEVELS.length-1)]),into:S.xp%LV_XP}};

function confetti(n=90){
  const c=document.getElementById('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#C9A84C','#6366F1','#F59E0B','#10B981','#EF4444','#0D1B2A'];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}

function mealCard(m,L){
  const done=L.done.includes(m.idx);
  return `<div class="meal ${done?'done':''} ${m.w?'workout':''}"><div class="meal-head"><div class="meal-ico">${done?'✅':m.i}</div><div><div class="meal-t">${L2(m.n)}</div><div class="meal-s">${m.tip?L2(m.tip):`${m.g.P}${G()} ${cl('P')} · ${m.g.C}${G()} ${cl('C')} · ${m.g.F}${G()} ${cl('F')}`}</div></div><div class="meal-k">${m.kcal}<small>${KC()}</small></div></div>
    <div class="items">${m.items.map(it=>`<button class="item" onclick="openSwap('${L.type}',${m.idx},'${it.k}')"><div class="e">${it.f.e}</div><div class="nm"><b>${fn(it.f)}</b><span class="tag ${CAT[it.k].cls}">${it.macro} ${G()} ${cl(it.k)}</span></div><div class="g">${it.grams}<small>${G()}</small></div><div class="sw">⇄</div></button>`).join('')}</div>
    ${m.intra?`<div class="extra">+ 10 ${G()} EAAs</div>`:''}
    <div class="meal-foot"><button class="done-btn" onclick="toggleMeal(${m.idx})">${done?tx('Done ✓ (tap to undo)','تمّ ✓ (ضغط باش ترجع)'):tx('I ate this ✓','كليت هادي ✓')}</button></div></div>`;
}
function setType(k){const L=dayLog();if(L.done.length&&L.type!==k){L.done=[]}L.type=k;save();render()}
function toggleMeal(i){
  const L=dayLog();const total=DAYS[L.type].meals.length;
  const mm=mealPlan(L.type)[i], det=mm.n[0]+': '+mm.items.map(x=>x.grams+'g '+x.f.n).join(', ');
  if(L.done.includes(i)){L.done=L.done.filter(x=>x!==i);S.xp=Math.max(0,S.xp-10-(L.done.length===total-1?50:0));push({type:'meal-undo',date:today(),details:det});render();return}
  L.done.push(i);push({type:'meal',date:today(),details:det,kcal:mm.kcal});
  const all=L.done.length===total;
  addXP(all?60:10,all?tx('🏆 Perfect day! +60 XP','🏆 نهار كامل! +60 XP'):'💪 +10 XP');
  unlock('first');
  if(all){confetti(160);unlock('day');const s=streak();if(s>=3)unlock('s3');if(s>=7)unlock('s7');if(s>=30)unlock('s30')}
  render();
}
function openSwap(day,idx,k){
  const m=mealPlan(day)[idx];const it=m.items.find(x=>x.k===k);
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet"><div class="grab"></div><h3>${tx('Swap '+cl(k).toLowerCase(),'بدّل '+cl(k))} · ${L2(m.n)}</h3><p class="sub">${tx('You need '+it.macro+' g of '+cl(k).toLowerCase()+'. Grams update automatically.','خاصك '+it.macro+' غ ديال '+cl(k)+'. الغرامات كيتبدلو بوحدهم.')}</p>
  ${FOODS[k].map(f=>`<button class="opt ${f.n===it.f.n?'on':''}" data-n="${f.n}"><div class="e">${f.e}</div><div><b>${fn(f)}</b><span>${tx('Weigh','توزن')} ${fh(f)}</span></div><div class="g">${r5(it.macro/f.v*100)} ${G()}</div></button>`).join('')}</div>`;
  ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.choices[day]=S.choices[day]||{};S.choices[day][idx]=S.choices[day][idx]||{};S.choices[day][idx][k]=b.dataset.n;
    if(day!=='R'){const o=day==='T'?'H':'T';S.choices[o]=S.choices[o]||{};S.choices[o][idx]=S.choices[o][idx]||{};S.choices[o][idx][k]=b.dataset.n}
    push({type:'swap',date:today(),details:L2(m.n)+': '+b.dataset.n});ov.remove();render();const f=food(k,b.dataset.n);toast(tx('Swapped to ','تبدلات ل ')+fn(f)+' '+f.e)});
  document.body.appendChild(ov);
}

function shopList(){
  const d=S.profile.days, mult={T:Math.max(0,d-1),H:Math.min(1,d),R:7-d}, tot={};
  Object.keys(mult).forEach(k=>{if(!mult[k])return;mealPlan(k).forEach(m=>m.items.forEach(it=>{const id=it.k+'|'+it.f.n;tot[id]=tot[id]||{k:it.k,f:it.f,g:0};tot[id].g+=it.grams*mult[k]}))});
  return Object.entries(tot).sort((a,b)=>'PCF'.indexOf(a[1].k)-'PCF'.indexOf(b[1].k)||b[1].g-a[1].g);
}
function shopView(){
  const list=shopList();const got=list.filter(([id])=>S.shop[id]).length;
  const fmt=g=>g>=1000?(g/1000).toFixed(g>=10000?0:1)+' '+tx('kg','كغ'):Math.round(g/10)*10+' '+G();
  let html=`<div class="top"><div><div class="brand">${tx('THIS WEEK','هاد السيمانة')}</div><div class="hello">${tx('Shopping List 🛒','ليستة الشوبينگ 🛒')}</div></div><div class="chips"><div class="chip">${got}/${list.length}</div>${langBtn()}</div></div>

  if(got)html+=`<button class="btn2" onclick="S.shop={};save();render()">${tx('Reset list for a new week','عاود الليستة لسيمانة جديدة')}</button>`;

const API_URL = 'https://script.google.com/macros/s/AKfycbyvGrlGJZoQi6-0fZWcANBDdyMsL34HZnAjQHLBvh7viRHk5Q29FM7MI1nqockIo3xE/exec';   // ← paste your Apps Script Web app URL here (ends with /exec)

let syncState = 'idle'; // idle | saving | ok | off
function syncChip(){
  if(!API_URL||!S.auth) return '';
  const m={saving:['⏳',tx('Saving…','كنحفظو…')],ok:['☁️',tx('Saved','محفوظ')],off:['⚠️',tx('Offline','بلا نت')],idle:['☁️','']}[syncState];
  return `<div class="chip" style="font-size:12px">${m[0]} ${m[1]}</div>`;
}
async function api(body){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});
  return r.json();
}
function summary(){
  const p=S.profile; if(!p) return {name:S.auth&&S.auth.name};
  const t=targets(p), w=weightStats(), lv=level();
  const plan=mealPlan('T').map(m=>m.n[0]+': '+m.items.map(i=>i.grams+'g '+i.f.n).join(', ')).join(' | ');
  return {name:S.auth.name,goal:p.goal,sex:p.sex,age:p.age,height:p.height,days:p.days,activity:p.activity,bf:p.bf,
    carbAdj:p.carbAdj||0,tdee:t.tdee,kcal:t.T.kcal,P:t.T.P,C:t.T.C,F:t.T.F,restKcal:t.R.kcal,
    startWeight:w.first??p.weight,latestWeight:w.last??p.weight,weeklyChange:w.change??'',advice:w.advice?w.advice.en:'',
    mealsLogged:Object.values(S.log).reduce((a,l)=>a+l.done.length,0),perfectDays:Object.keys(S.log).filter(dayComplete).length,
    streak:streak(),xp:S.xp,level:lv.i+1+' '+LEVELS[Math.min(lv.i,LEVELS.length-1)][0],plan,lang:LANG};
}
const syncQueue=[];
function push(event){
  S.dirty=true; save();
  if(!API_URL||!S.auth) return;
  if(event) syncQueue.push(event);
  flush();
}
let flushing=false;
async function flush(){
  if(flushing||!API_URL||!S.auth) return; flushing=true; syncState='saving'; updChip();
  try{
    await null;
    do{
      const ev=syncQueue.shift();
      const st={...S}; delete st.auth;
      const res=await api({action:'sync',phone:S.auth.phone,pin:S.auth.pin,state:st,summary:summary(),event:ev});
      if(!res.ok){ if(ev) syncQueue.unshift(ev); throw new Error(res.error); }
    }while(syncQueue.length);
    S.dirty=false; save(); syncState='ok';
  }catch(e){ syncState='off'; }
  flushing=false; updChip();
}
function updChip(){const el=document.getElementById('sync');if(el)el.innerHTML=syncChip()}
window.addEventListener('online',()=>{if(S.dirty)flush()});

/* ---------- login screen ---------- */
let loginErr='', loginBusy=false;
function loginView(){
  const R=document.getElementById('root');
  R.innerHTML=`<div class="wiz"><div class="wiz-top" style="justify-content:flex-end">${langBtn()}</div>
    <div class="brand" style="margin-top:28px">${tx('ACHRAF AHMADI COACHING','أشرف أحمدي كوتشينگ')}</div>
    <h1 style="margin-top:8px">${tx('Your diet, built for you 🍽️','الدايت ديالك، مفصل عليك 🍽️')}</h1>
    <p class="lead">${tx('Sign in so your plan and progress are saved — on any phone.','دخل باش البلان والتقدم ديالك يتحفظو — فأي تيليفون.')}</p>
    <div class="num"><div class="lab">${tx('Your name','السمية ديالك')}</div><input id="ln" class="fld" value="${(S.authDraft&&S.authDraft.name)||''}" placeholder="${tx('e.g. Yassine','مثلا: ياسين')}" autocomplete="name"></div>
    <div class="num"><div class="lab">${tx('WhatsApp number','رقم الواتساب')}</div><input id="lp" class="fld" dir="ltr" inputmode="tel" value="${(S.authDraft&&S.authDraft.phone)||''}" placeholder="+212 6XX XX XX XX" autocomplete="tel"></div>
    <div class="num"><div class="lab">${tx('4-digit PIN (you choose it)','رمز سري ديال 4 أرقام (ختارو نتا)')}</div><input id="lk" class="fld" dir="ltr" inputmode="numeric" maxlength="4" type="password" placeholder="••••"></div>
    ${loginErr?`<div class="note" style="color:var(--red);margin-bottom:8px">${loginErr}</div>`:''}
    <p class="lead" style="font-size:12px;margin:4px 0 0">${tx('Already have an account? Use the same number and PIN.','عندك حساب؟ دخل بنفس الرقم والرمز.')}</p>
    <div class="cta"><button ${loginBusy?'disabled':''} onclick="doLogin()">${loginBusy?tx('Checking…','كنتحققو…'):tx('Continue','كمل')}</button></div></div>`;
}
async function doLogin(){
  const name=document.getElementById('ln').value.trim(), phone=document.getElementById('lp').value.replace(/[^\d]/g,''), pin=document.getElementById('lk').value.trim();
  S.authDraft={name,phone};
  if(name.length<2){loginErr=tx('Enter your name.','دخل السمية ديالك.');return loginView()}
  if(phone.length<9){loginErr=tx('Enter a valid WhatsApp number.','دخل رقم واتساب صحيح.');return loginView()}
  if(!/^\d{4}$/.test(pin)){loginErr=tx('PIN must be 4 digits.','الرمز خاصو يكون 4 أرقام.');return loginView()}
  loginErr='';loginBusy=true;loginView();
  try{
    const res=await api({action:'login',phone,pin,name});
    loginBusy=false;
    if(!res.ok){loginErr=res.error==='wrong_pin'?tx('Wrong PIN for this number.','الرمز غالط لهاد الرقم.'):tx('Something went wrong. Try again.','وقع مشكل. عاود جرب.');return loginView()}
    const keepLang=LANG;
    if(res.state){S={...defaultState(),...res.state}}
    else if(!res.isNew){S={...defaultState()}}
    S.auth={phone,pin,name:res.name||name}; delete S.authDraft; save();
    if(keepLang!==LANG)applyDir();
    render(); if(S.profile) toast(tx('Welcome back, ','مرحبا بيك مرة أخرى، ')+S.auth.name+' 👋');
    push(null);
  }catch(e){loginBusy=false;loginErr=tx('No connection. Check your internet.','ما كاينش الكونيكسيون. شوف الأنترنت.');loginView()}
}
function signOut(){
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet"><div class="grab"></div><h3>${tx('Sign out?','تخرج؟')}</h3><p class="sub">${tx('Your data is saved. Sign in again with the same number and PIN.','المعلومات ديالك محفوظة. دخل بنفس الرقم والرمز.')}</p><button class="btn2" style="width:100%;margin:0 0 8px;background:var(--navy);color:#fff" id="yes">${tx('Sign out','خروج')}</button><button class="btn2" style="width:100%;margin:0" id="no">${tx('Cancel','رجع')}</button></div>`;
  document.body.appendChild(ov);ov.querySelector('#no').onclick=()=>ov.remove();
  ov.querySelector('#yes').onclick=()=>{S=defaultState();save();ov.remove();view='today';render()};
}

/* =========================================================
   WEIGHT PROGRESS
========================================================= */
function weightStats(){
  const ds=Object.keys(S.weights||{}).sort(); if(!ds.length) return {weeks:[]};
  const start=ds[0], dayN=d=>Math.round((new Date(d+'T12:00:00')-new Date(start+'T12:00:00'))/864e5);
  const weeks=[];
  ds.forEach(d=>{const w=Math.floor(dayN(d)/7);(weeks[w]=weeks[w]||{w,vals:[]}).vals.push(S.weights[d])});
  const W=weeks.filter(Boolean).map(x=>({w:x.w,n:x.vals.length,avg:+(x.vals.reduce((a,b)=>a+b,0)/x.vals.length).toFixed(2)}));
  let change=null,advice=null;
  if(W.length>=2){
    const a=W[W.length-2],b=W[W.length-1];
    if(b.n>=3&&a.n>=3){change=+(b.avg-a.avg).toFixed(2);advice=adviceFor(change,a.avg)}
  }
  return {weeks:W,first:S.weights[ds[0]],last:S.weights[ds[ds.length-1]],change,advice,start};
}
function adviceFor(ch,prev){
  const g=S.profile.goal, A=(en,ar,adj)=>({en,ar,adj});
  const ok=A('On track: keep everything the same','ماشي مزيان: خلي كلشي كيف هو',0);
  if(g==='Bulk'){ if(ch<0.1) return A('Too slow: add +25 g carbs per day','بطيء: زيد 25 غ ديال الكارب فالنهار',25);
                  if(ch>0.6) return A('Too fast: remove 25 g carbs per day','سريع بزاف: نقص 25 غ ديال الكارب فالنهار',-25); return ok }
  if(g==='Cut'){ const pct=ch/prev; if(pct>-0.0025) return A('Too slow: remove 25 g carbs per day (or walk more)','بطيء: نقص 25 غ ديال الكارب (ولا تمشى كثر)',-25);
                  if(pct<-0.012) return A('Too fast: add 25 g carbs per day','سريع بزاف: زيد 25 غ ديال الكارب',25); return ok }
  if(Math.abs(ch)<=0.3) return ok;
  return ch>0?A('Drifting up: remove 25 g carbs per day','الوزن طالع: نقص 25 غ ديال الكارب',-25):A('Drifting down: add 25 g carbs per day','الوزن هابط: زيد 25 غ ديال الكارب',25);
}
let wDraft=null;
function progressView(){
  const st=weightStats(), td=today(), last=st.last??S.profile.weight;
  if(wDraft===null) wDraft=S.weights[td]??last;
  const goalTxt={Bulk:tx('+0.25 to +0.5 kg per week','+0.25 حتى +0.5 كغ فالسيمانة'),Cut:tx('−0.5% to −1% of bodyweight per week','−0.5% حتى −1% من الوزن فالسيمانة')}[S.profile.goal]||tx('stay within ±0.3 kg','بقى فحدود ±0.3 كغ');
  const adj=S.profile.carbAdj||0;
  let adv='';
  if(st.advice){
    const a=st.advice, good=a.adj===0;
    adv=`<div class="card" style="background:${good?'#E8F9EE':'var(--gold-l)'}"><div style="font-weight:800;font-size:15px">${good?'✅':'⚖️'} ${L2([a.en,a.ar])}</div>
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:4px">${tx('Last week vs the week before','السيمانة اللي فاتت مقارنة مع اللي قبلها')}: <b dir="ltr">${st.change>0?'+':''}${st.change} ${tx('kg','كغ')}</b></div>
      ${good?'':`<button class="done-btn" style="margin-top:12px" onclick="applyAdj(${a.adj})">${tx('Apply','طبق')} ${a.adj>0?'+':''}${a.adj} ${G()} ${cl('C')}</button>
      <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:8px">${tx('Tip: only adjust if you see this 2 weeks in a row.','نصيحة: بدل غير إلا شفتي هادي جوج سيمانات متتابعين.')}</div>`}</div>`;
  }else{
    adv=`<div class="note" style="margin:0 20px 14px">📅 ${tx('Weigh in every morning. After 2 weeks (3+ weigh-ins each) you get your first advice.','توزن كل صباح. من بعد جوج سيمانات (3 مرات فالسيمانة على الأقل) غادي تجيك أول نصيحة.')}</div>`;
  }
  return `<div class="top"><div><div class="brand">${tx('WEIGH-INS','الوزن')}</div><div class="hello">${tx('Progress 📈','التقدم 📈')}</div></div><div class="chips"><span id="sync">${syncChip()}</span>${langBtn()}</div></div>
  <div class="card"><div style="font-size:13px;font-weight:700;color:var(--muted)">${tx("Today's morning weight",'الوزن ديال الصباح اليوم')}</div>
    <div class="row" dir="ltr" style="display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px">
      <button class="step-btn" onclick="wDraft=Math.round((wDraft-0.1)*10)/10;render()">−</button>
      <div style="font-size:40px;font-weight:800" dir="ltr">${(+wDraft).toFixed(1)}<small style="font-size:16px;color:var(--muted)"> ${tx('kg','كغ')}</small></div>
      <button class="step-btn" onclick="wDraft=Math.round((wDraft+0.1)*10)/10;render()">+</button></div>
    <button class="done-btn" onclick="saveWeight()">${S.weights[td]!=null?tx('Update today ✓','حدث اليوم ✓'):tx('Save weight ✓','سجل الوزن ✓')}</button>
    <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:8px;text-align:center">${tx('After the toilet, before eating','من بعد التواليت، قبل الماكلة')} · ${tx('Target','الهدف')}: ${goalTxt}</div></div>
  ${adv}
  ${chart()}
  <div class="h2">${tx('Weekly averages','المعدل ديال كل سيمانة')}</div>
  <div class="card" style="padding:4px 18px">${st.weeks.length?st.weeks.slice().reverse().map((w,i,arr)=>{const prev=arr[i+1];const d=prev?+(w.avg-prev.avg).toFixed(2):null;
     return `<div class="row-l"><span>${tx('Week','السيمانة')} ${w.w+1} <span style="color:var(--muted);font-size:12px">(${w.n}×)</span></span><span dir="ltr"><b>${w.avg.toFixed(1)} ${tx('kg','كغ')}</b>${d!==null?` <span style="color:var(--muted);font-size:12px">${d>0?'+':''}${d}</span>`:''}</span></div>`}).join('')
     :`<div class="row-l"><span style="color:var(--muted)">${tx('No weigh-ins yet','مازال ما سجلتي حتى وزن')}</span></div>`}</div>
  <div class="card"><div class="row-l"><span>🍚 ${tx('Carb adjustment','تعديل الكارب')}</span><span dir="ltr" style="display:flex;gap:8px;align-items:center"><button class="step-btn" style="width:36px;height:36px" onclick="applyAdj(-25)">−</button><b dir="ltr">${adj>0?'+':''}${adj} ${G()}</b><button class="step-btn" style="width:36px;height:36px" onclick="applyAdj(25)">+</button></span></div>
  <div style="font-size:11px;color:var(--muted);font-weight:600">${tx('Changes your carbs on every day type. The whole plan and shopping list update.','كيبدل الكارب فجميع الأيام. البلان والشوبينگ كيتبدلو بوحدهم.')}</div></div>`;
}
function chart(){
  const ds=Object.keys(S.weights||{}).sort().slice(-42); if(ds.length<2) return '';
  const v=ds.map(d=>S.weights[d]), mn=Math.min(...v)-0.3, mx=Math.max(...v)+0.3, W=320,H=120;
  const x=i=>10+i*(W-20)/(ds.length-1), y=k=>H-10-(k-mn)/(mx-mn)*(H-20);
  const pts=v.map((k,i)=>`${x(i).toFixed(1)},${y(k).toFixed(1)}`).join(' ');
  return `<div class="card" style="padding:14px 10px 6px"><svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr"><polyline fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>${v.map((k,i)=>`<circle cx="${x(i)}" cy="${y(k)}" r="3" fill="var(--navy)"/>`).join('')}</svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;padding:0 6px" dir="ltr"><span>${ds[0].slice(5)}</span><span>${mn.toFixed(1)}–${mx.toFixed(1)} kg</span><span>${ds[ds.length-1].slice(5)}</span></div></div>`;
}
function saveWeight(){
  const d=today(), kg=+(+wDraft).toFixed(1); const first=S.weights[d]==null;
  S.weights[d]=kg; push({type:'weight',date:d,kg,details:kg+' kg'});
  if(first){addXP(15,tx('⚖️ Weight saved +15 XP','⚖️ الوزن تسجل +15 XP'))}else toast(tx('Updated ✓','تحدث ✓'));
  render();
}
function applyAdj(n){
  S.profile.carbAdj=Math.max(-150,Math.min(150,(S.profile.carbAdj||0)+n));
  push({type:'carb-adjust',date:today(),details:(n>0?'+':'')+n+' g → total '+S.profile.carbAdj+' g'});
  toast(tx('Carbs updated: ','الكارب تبدل: ')+(S.profile.carbAdj>0?'+':'')+S.profile.carbAdj+' '+G());render();
}

applyDir();
render();
if(S.dirty&&S.auth)flush();
</script>
